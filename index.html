<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildBrightness</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c12; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  #target {
    position: fixed; top: 30px; left: 0; right: 0; text-align: center;
    font: 200 clamp(28px, 6vw, 56px)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.04em; pointer-events: none; user-select: none;
  }
  #msg {
    position: fixed; left: 0; right: 0; bottom: 28px;
    text-align: center; padding: 0 20px;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.02em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="target"></div>
<div id="msg">press and hold the center. keep on it. let go when it's the right brightness.</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const msg = document.getElementById('msg');
const tgtEl = document.getElementById('target');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let phase = 0, level = 0, setLevel = 0, holding = false;
let px = -1e4, py = -1e4, last = performance.now();
let shake = 0, flash = 0;
const parts = [], shocks = [], trail = [];

// you're given a brightness to hit. good luck.
function pick() { return 10 + Math.floor(Math.random() * 86); }
let target = pick();
function showTarget() { tgtEl.textContent = 'set it to ' + target + '%'; }
showTarget();

const R = () => Math.min(W, H) * 0.38;

function center() {
  return {
    x: W / 2 + W * 0.28 * Math.sin(phase * 0.9) + 14 * Math.sin(phase * 3.1),
    y: H / 2 + H * 0.26 * Math.sin(phase * 1.3 + 1) + 14 * Math.cos(phase * 2.7)
  };
}
function hitR() { return Math.max(16, Math.min(W, H) * 0.035) * (1 - 0.55 * level); }
function say(t) { msg.textContent = t; }

// ---- sound ----
let ac = null, osc = null, gain = null;
function audioStart() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    osc = ac.createOscillator(); gain = ac.createGain();
    osc.type = 'sine'; gain.gain.value = 0;
    osc.connect(gain); gain.connect(ac.destination);
    osc.start();
    gain.gain.setTargetAtTime(0.06, ac.currentTime, 0.05);
  } catch (e) {}
}
function audioUpdate(l) { if (osc) osc.frequency.setTargetAtTime(180 + 620 * l, ac.currentTime, 0.03); }
function audioStop() {
  if (!osc) return;
  const o = osc; gain.gain.setTargetAtTime(0, ac.currentTime, 0.03); osc = null;
  setTimeout(() => { try { o.stop(); } catch (e) {} }, 250);
}
function blip(f, d, type) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + d);
}

// ---- effects ----
function spark(x, y, a, s, life, size) {
  parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size });
}

function finish(c) {
  holding = false;
  audioStop();
  setLevel = level;
  const pct = Math.round(setLevel * 100);
  window.brightness = pct;
  const off = Math.abs(pct - target);
  for (let i = 0; i < 70; i++) spark(c.x, c.y, Math.random() * 6.283, 80 + Math.random() * 240, 0.8 + Math.random() * 0.6, 1 + Math.random() * 2.5);
  shocks.push({ r: R() * level, a: 0.8 });
  blip(300 + 500 * level, 0.3);
  if (off === 0) say(pct + '%. exactly right. suspicious.');
  else if (off <= 3) say(pct + '%. so close. off by ' + off + '.');
  else say('you got ' + pct + '%. off by ' + off + '.');
  setTimeout(() => { target = pick(); showTarget(); }, 2600);
}

function fail() {
  holding = false;
  audioStop();
  level = 0; setLevel = 0;
  window.brightness = 0;
  shake = 1; flash = 0.35;
  blip(90, 0.4, 'sawtooth');
  say('you slipped. brightness is back to 0%.');
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  phase += dt * (0.5 + 1.6 * level);
  const c = center();
  trail.push({ x: c.x, y: c.y });
  if (trail.length > 36) trail.shift();

  if (holding) {
    if (Math.hypot(px - c.x, py - c.y) <= hitR()) {
      level = Math.min(1, level + dt * 0.25 * (1.05 - 0.75 * level));
      audioUpdate(level);
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * 6.283;
        spark(c.x + Math.cos(a) * R() * level, c.y + Math.sin(a) * R() * level, a, 30 + Math.random() * 60, 0.6 + Math.random() * 0.5, 1 + Math.random() * 2);
      }
      if (level >= 1) finish(c);
    } else {
      fail();
    }
  } else {
    level = Math.max(0, level - dt * 1.5);
  }

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (const s of shocks) { s.r += 500 * dt; s.a -= dt * 1.6; }
  for (let i = shocks.length - 1; i >= 0; i--) if (shocks[i].a <= 0) shocks.splice(i, 1);
  shake = Math.max(0, shake - dt * 2.5);
  flash = Math.max(0, flash - dt * 0.9);

  draw(c);
  requestAnimationFrame(frame);
}

function draw(c) {
  const b = holding ? level : Math.max(setLevel, level);
  const L = 4 + 92 * b;
  ctx.fillStyle = 'hsl(220 18% ' + L + '%)';
  ctx.fillRect(0, 0, W, H);

  const ink = L > 55 ? '10,12,20' : '245,248,255';
  const col = 'rgba(' + ink + ',0.75)';
  msg.style.color = col; tgtEl.style.color = col;

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 18 * shake, (Math.random() - 0.5) * 18 * shake);

  // the light itself
  const glowR = R() * (0.5 + level * 2.5);
  const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, glowR);
  g.addColorStop(0, 'rgba(255,214,140,' + (0.55 * b) + ')');
  g.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.globalCompositeOperation = 'source-over';

  // unlabeled guide rings
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(' + ink + ',0.12)';
  for (const f of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath(); ctx.arc(c.x, c.y, R() * f, 0, 6.283); ctx.stroke();
  }

  // shockwaves
  for (const s of shocks) {
    ctx.strokeStyle = 'rgba(' + ink + ',' + Math.max(0, s.a) * 0.6 + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, s.r, 0, 6.283); ctx.stroke();
  }

  // comet trail
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    ctx.fillStyle = 'rgba(' + ink + ',' + t * 0.25 + ')';
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, hitR() * t * 0.6, 0, 6.283); ctx.fill();
  }

  // growing ring, glowing
  if (level > 0.002) {
    ctx.shadowColor = 'rgba(255,200,110,0.9)';
    ctx.shadowBlur = 10 + 30 * level;
    ctx.strokeStyle = 'rgba(' + ink + ',0.95)';
    ctx.lineWidth = 3 + level * 5;
    ctx.beginPath(); ctx.arc(c.x, c.y, R() * level, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // the center
  ctx.shadowColor = 'rgba(255,200,110,0.9)';
  ctx.shadowBlur = 14 + 30 * level;
  ctx.fillStyle = 'rgb(' + ink + ')';
  ctx.beginPath(); ctx.arc(c.x, c.y, hitR(), 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;

  // sparks
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.fillStyle = 'rgba(255,220,150,' + Math.max(0, p.life / p.max) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,50,50,' + flash + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

cv.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; });

cv.addEventListener('pointerdown', e => {
  px = e.clientX; py = e.clientY;
  cv.setPointerCapture(e.pointerId);
  const c = center();
  if (Math.hypot(px - c.x, py - c.y) <= hitR()) {
    holding = true;
    level = 0;
    audioStart();
    say('');
  } else {
    say("that's not the center.");
  }
});

function release() { if (holding) finish(center()); }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

requestAnimationFrame(frame);
</script>
</body>
</html>
